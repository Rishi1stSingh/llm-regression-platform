name: LLM evaluation

on:
  pull_request:
    paths: ["prompts/**", "data/**", "src/**"]
  workflow_dispatch:

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      # Replace --mock with the live client after storing NVIDIA_API_KEY as a repository secret.
      - run: python main.py run --version v1 --mock --no-slack
      - run: python main.py run --version v2 --baseline-version v1 --mock --no-slack
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evaluation-reports
          path: artifacts/reports/
