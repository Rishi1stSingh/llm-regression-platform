name: LLM Regression CI

on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'data/**'
      - 'prompts/**'
      - 'config.json'
      - 'main.py'
      - '.github/workflows/**'
      - 'requirements.txt'
      - 'pyproject.toml'

  push:
    branches: [main, master]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'data/**'
      - 'prompts/**'
      - 'config.json'
      - 'main.py'
      - '.github/workflows/**'
      - 'requirements.txt'
      - 'pyproject.toml'

  workflow_dispatch:

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run unit tests
        run: uv run pytest tests/ -v --tb=short --timeout=60

  evaluate:
    name: Groq Evaluation
    runs-on: ubuntu-latest
    needs: test

    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --frozen

      - name: Create artifacts directory
        run: mkdir -p artifacts/reports

      - name: Run Groq evaluation
        id: eval
        continue-on-error: true
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          uv run python main.py run \
            --version v1 \
            --provider groq \
            --dataset classification \
            --cases 10 \
            2>&1

      - name: Upload evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-report-${{ github.run_number }}
          path: artifacts/reports/
          retention-days: 30

      - name: Upload evaluation database
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-database-${{ github.run_number }}
          path: artifacts/evaluations.db
          retention-days: 14

      - name: Fail if evaluation failed
        if: steps.eval.outcome == 'failure'
        run: exit 1